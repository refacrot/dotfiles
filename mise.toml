[settings]
  idiomatic_version_file_enable_tools = []
  minimum_release_age = "24h"
  minimum_release_age_excludes = ["claude-code", "codex"]
  dotfiles.root = "~/.dotfiles"
  dotfiles.default_mode = "symlink"

[tools]
  ruby = "latest"
  go = "latest"
  # Ai
  codex = "latest"

  atuin = "latest"

[settings.ruby]
  compile = false

[dotfiles]
  "~/.config/zsh/rc.zsh" = "zsh/rc.zsh"
  "~/.zshrc/rc" = { line = 'source ~/.config/zsh/rc.zsh' }

  "~/.config/mise/config.toml" = "mise.toml"
  "~/.config/nvim/init.lua" = "nvim/init.lua"
  "~/.config/ghostty" = "ghostty"
  "~/.gitconfig" = ".gitconfig"

[bootstrap.brew]
  adopt = true

[bootstrap.packages]
  # mise's own build has self-update disabled ("update mise the same way you
  # installed it"), and that way is brew — so brew is what moves it.
  "brew:mise" = "latest"
  "brew-cask:chatgpt" = "latest"
  "brew-cask:1password-cli" = "latest"

[tasks.upgrade]
  description = "update mise tools and Homebrew installed packages"
  run = [
    "mise upgrade",
    "brew update",
    "brew upgrade -y",
    "mise bootstrap packages upgrade --yes"
  ]
